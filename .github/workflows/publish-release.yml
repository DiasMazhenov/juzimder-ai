name: Publish shared-hosting release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]) ;;
            *) echo "Expected a tag such as v00.00.333" >&2; exit 1 ;;
          esac
          product_version=${RELEASE_TAG#v}
          package_version=$(node -p "require('./package.json').productVersion")
          if [ "$product_version" != "$package_version" ]; then
            echo "Tag version and package.json productVersion do not match" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Only commits already present in main may be published" >&2
            exit 1
          fi

      - name: Build portable shared-hosting package
        run: |
          npm ci
          npm run package:shared-hosting
          (cd build && sha256sum juzimder-ai-shared-hosting.zip > juzimder-ai-shared-hosting.zip.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Juzimder AI ${RELEASE_TAG#v}" \
            --generate-notes \
            build/juzimder-ai-shared-hosting.zip \
            build/juzimder-ai-shared-hosting.zip.sha256
